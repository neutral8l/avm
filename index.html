<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CRM — нефтепродукты</title>
<style>
:root{--bg:#f4f5f7;--c:#fff;--t:#1d2430;--m:#6b7482;--a:#1f6feb;--b:#dfe3e8;--r:#d92d20;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--c:#1d2229;--t:#e8ebf0;--m:#98a1ae;--a:#5b9cff;--b:#2f3640;--r:#ff6b60}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--c);border-bottom:1px solid var(--b);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header h1{font-size:16px;margin:0 12px 0 0}main{max-width:1100px;margin:0 auto;padding:14px}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:7px;padding:6px 10px}
button{cursor:pointer}button.p,button.on{background:var(--a);color:#fff;border-color:var(--a)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.bar input{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--m);gap:3px}label input,label select{width:100%;color:var(--t);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;cursor:pointer}.card small{display:block;color:var(--m)}
table{width:100%;border-collapse:collapse;background:var(--c)}th,td{border-bottom:1px solid var(--b);padding:6px;text-align:left;vertical-align:middle}th{font-size:12px;color:var(--m)}
td input{width:100%;min-width:60px}.wrap{overflow-x:auto}tr.me{font-weight:600}tr.click{cursor:pointer}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--b)}.m{color:var(--m)}.od{color:var(--r);font-weight:600}
#ov{display:none;position:fixed;inset:0;background:#0007;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px;z-index:9}
#m{background:var(--c);border-radius:12px;padding:16px;width:min(900px,100%)}h3,h4{margin:8px 0}
.th{max-height:180px;overflow:auto;border:1px solid var(--b);border-radius:8px;padding:8px;margin:8px 0}.th div{margin-bottom:6px}

.stamp{width:120px;height:120px;border:3px double #1a3fa8;color:#1a3fa8;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;transform:rotate(-12deg);padding:14px}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.pl{grid-template-columns:1fr}}
.sec{display:flex;gap:6px;align-items:center;border:2px dashed var(--b);border-radius:8px;padding:6px 8px;margin-bottom:6px;min-height:50px;cursor:pointer}
.sec.f{border:2px solid var(--a);background:color-mix(in srgb,var(--a) 14%,var(--c))}.sec.hv{outline:3px solid var(--a)}
.sec .i{flex:1}.sec input{width:92px}.sec small{display:block}
.oc{background:color-mix(in srgb,#e91e63 20%,var(--c));border:1px solid #e91e63;border-radius:8px;padding:8px;margin-bottom:6px;cursor:grab;user-select:none}
.oc.sel{outline:3px solid var(--a)}
.tn{width:100%;border-collapse:collapse;background:#fff;color:#000}.tn td,.tn th{border:1px solid #000;padding:3px 6px;font-size:12px;color:#000;text-align:left;vertical-align:top}
.oc{border:1px solid #4a5360;margin-bottom:12px;background:#1d2229;color:#e8ebf0}.oc.me{box-shadow:0 0 0 2px #5b9cff}.och{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 8px;background:#2a313b;border-bottom:1px solid #4a5360;font-size:13px}.och .sp{flex:1}.och button{color:#fff;border:0;padding:5px 10px;cursor:pointer;border-radius:3px}.och b[onclick]{color:#7fb2ff!important}.bg{background:#1a7f37}.bb{background:#1f6feb}.br{background:#d92d20}.lt{width:100%;border-collapse:collapse;background:#1d2229}.lt th,.lt td{border:1px solid #4a5360;border-top:0;padding:8px;font-size:13px;color:#e8ebf0;vertical-align:top}.lt th{background:#252b34;text-align:center}.oc .m{color:#98a1ae}.kt{width:100%;border-collapse:collapse;background:#fff;color:#000}.kt th,.kt td{border:1px solid #000;padding:16px 10px;font-size:14px;color:#000;vertical-align:middle}.kt th{text-align:center}.kt td:nth-child(2),.kt th:nth-child(2){white-space:nowrap;width:1%}
.cb{position:relative}.cb input{width:100%}
.cbl{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:2px;max-height:230px;overflow:auto;background:var(--c);border:1px solid var(--b);border-radius:7px;box-shadow:0 8px 20px #0003;display:none}
.cbl div{padding:8px 10px;cursor:pointer;font-size:14px;color:var(--t);border-bottom:1px solid var(--b)}.cbl div:last-child{border:0}
#rw{position:fixed;right:16px;bottom:16px;z-index:12;width:min(330px,calc(100vw - 32px));background:var(--c);border:1px solid var(--b);border-radius:12px;box-shadow:0 8px 24px #0003;font-size:13px}
#rw .h{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-weight:600;user-select:none}
#rw .n{background:var(--r);color:#fff;border-radius:99px;padding:0 7px;font-size:11px;line-height:18px}
#rw .bd{padding:0 12px 12px}#rw.min .bd{display:none}
#rwl{max-height:34vh;overflow:auto;margin-bottom:8px}
#rwl .it{display:flex;gap:6px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--b)}#rwl .it .d{white-space:nowrap}
#rwl .it button{padding:0 7px;line-height:20px}
#rw .f{display:flex;gap:6px;flex-wrap:wrap}#rw .f input[type=text]{flex:1 1 100%}#rw .f input[type=date]{flex:1;min-width:0}
.toast{display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d2430;color:#fff;padding:10px 16px;border-radius:8px;z-index:50;max-width:92vw;font-size:13px}
#ov2{display:none;position:fixed;inset:0;background:#0007;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 10px;z-index:19}
#m2{background:var(--c);border-radius:12px;padding:16px;width:min(560px,100%)}
.ni{padding:10px 12px;border:1px solid var(--b);border-radius:8px;margin-bottom:6px;cursor:pointer}.ni:hover{background:color-mix(in srgb,var(--a) 15%,var(--c))}.ni small{display:block;color:var(--m)}.cbl div:hover{background:color-mix(in srgb,var(--a) 15%,var(--c))}
@media print{body *{visibility:hidden}.paper,.paper *{visibility:visible}.paper{position:absolute;left:0;top:0;width:100%;border:0}}
</style></head><body>
<header><h1>CRM · нефтепродукты</h1><span id="nav"></span><span style="flex:1"></span><span id="st" class="tag">Загрузка…</span><button id="imp" style="display:none" onclick="importLocal()">Импорт из браузера</button><button onclick="editMe()">Наша организация</button></header>
<!-- v2: добавлена сборка машин по секциям -->
<main><div class="tabs" id="sub"></div><div id="body"></div></main>
<div id="ov"><div id="m"></div></div>
<div id="ov2"><div id="m2"></div></div>
<div id="toast" class="toast"></div>
<div id="rw"></div>
<script src="firebase-config.js"></script>
<script>
/* Подключение общей базы Firebase: имитирует интерфейс claude.use('db') для приложения */
(function(){let res;window.__fb=new Promise(r=>res=r);window.__fbResolve=res;window.__fbStarted=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
window.claude={use:async n=>{const a=await Promise.race([window.__fb,sleep(7000).then(()=>window.__fbStarted?window.__fb:null)]);return a?(a[n]||null):null}}})();
</script>
<script type="module">
const done=v=>window.__fbResolve(v);
try{
 const cfg=window.FIREBASE_CONFIG;
 if(!cfg||!cfg.apiKey||/ВСТАВЬТЕ|YOUR_/i.test(cfg.apiKey)||!cfg.projectId){done(null)}
 else{
  window.__fbStarted=true;
  const B='https://www.gstatic.com/firebasejs/10.12.2/';
  const [A,Au,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const app=A.initializeApp(cfg),auth=Au.getAuth(app),fs=F.getFirestore(app);
  const mapErr=e=>({code:e&&e.code=='permission-denied'?'invalid_argument':e&&e.code=='resource-exhausted'?'quota_exceeded':(e&&e.code)||'unavailable',message:(e&&e.message)||''});
  const api={
   db:{doc:p=>({set:async d=>{try{await F.setDoc(F.doc(fs,p),d)}catch(e){throw mapErr(e)}},delete:async()=>{try{await F.deleteDoc(F.doc(fs,p))}catch(e){throw mapErr(e)}}}),
    collection:c=>({onSnapshot:(next,err)=>F.onSnapshot(F.collection(fs,c),s=>{if(s.metadata&&s.metadata.fromCache)return;next({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))})},e=>{if(err)err(mapErr(e))})})},
   user:{can:async()=>true,id:async()=>auth.currentUser?auth.currentUser.uid:null,isOwner:async()=>false,canEdit:async()=>true}};
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:100;background:var(--bg,#f4f5f7);display:none;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML='<form id="lf" style="background:var(--c,#fff);border:1px solid var(--b,#dfe3e8);border-radius:12px;padding:22px;width:min(340px,100%);display:flex;flex-direction:column;gap:10px"><h3 style="margin:0">CRM · вход</h3><label>E-mail<input id="le" type="email" autocomplete="username" required></label><label>Пароль<input id="lp" type="password" autocomplete="current-password" required></label><div id="lm" style="color:var(--r,#d92d20);font-size:13px;min-height:16px"></div><button class="p" type="submit">Войти</button></form>';
  document.body.appendChild(ov);
  ov.querySelector('#lf').onsubmit=async e=>{e.preventDefault();const m=ov.querySelector('#lm');m.textContent='';
   try{await Au.signInWithEmailAndPassword(auth,ov.querySelector('#le').value.trim(),ov.querySelector('#lp').value)}
   catch(x){const c=x&&x.code||'';m.textContent=/invalid|wrong-password|user-not-found|invalid-email/.test(c)?'Неверный e-mail или пароль':c=='auth/too-many-requests'?'Слишком много попыток. Подождите и повторите.':c=='auth/network-request-failed'?'Нет связи с сервером':'Не удалось войти ('+c+')'}};
  let started=false;
  Au.onAuthStateChanged(auth,u=>{
   if(u){ov.style.display='none';
    if(!started){started=true;
     const h=document.querySelector('header'),b=document.createElement('button');b.textContent='Выйти';b.title=u.email||'';
     b.onclick=()=>Au.signOut(auth).then(()=>location.reload());h&&h.appendChild(b);done(api)}}
   else{if(started){location.reload();return}ov.style.display='flex'}});
 }
}catch(e){console.error(e);done(null)}
</script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={clients:[],suppliers:[],carriers:[],vehicles:[],drivers:[],orders:[],reminders:[],docs:[],trips:[],nom:[],me:{},seq:1};
/* ===== Общая база (db) + локальный режим ===== */
let _u=Math.floor(Math.random()*1000);const uid=()=>Date.now()*1000+(_u=(_u+1)%1000);
const COLS=['clients','suppliers','carriers','vehicles','drivers','orders','trips','reminders','docs','nom'],IMG=['logo','stamp','sig'];
let DB=null,READY=false,SYNC={me:'{}'},FL=0,AGAIN=0,TM=0,DIRTY=0,RO=false,ROW=0;
const toast=t=>{const e=$('#toast');if(!e)return;e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',7000)};
const setSt=(t,c)=>{const e=$('#st');if(e){e.textContent=t;e.style.color=c||''}};
const localSave=()=>{try{localStorage.setItem('crm',JSON.stringify(S))}catch(e){}};
const save=()=>{if(!DB)return localSave();if(RO){if(!ROW){ROW=1;toast('Режим просмотра: изменения не сохраняются. Попросите владельца выдать вам роль Contributor или Editor.')}return}clearTimeout(TM);TM=setTimeout(flush,120)};
async function flush(){if(FL){AGAIN=1;return}FL=1;try{do{AGAIN=0;await syncOnce()}while(AGAIN)}catch(e){fail(e)}FL=0}
function fail(e){const c=e&&e.code;toast(c=='quota_exceeded'?'Достигнут лимит базы: '+(e.message||''):c=='invalid_argument'?'Не удалось сохранить: нет прав на запись или слишком большой файл (изображения до ~170 КБ). Для записи нужна роль Contributor или Editor.':'Не удалось сохранить: '+((e&&e.message)||c||'ошибка'));setSt('● Ошибка сохранения','var(--r)')}
async function syncOnce(){
 setSt('● Сохранение…','');let bad=0;const F=e=>{bad=1;fail(e)};
 for(const c of COLS){const cur=new Map(S[c].map(o=>[String(o.id),JSON.stringify(o)])),prev=SYNC[c]||(SYNC[c]=new Map());
  for(const [id,js] of cur)if(prev.get(id)!==js){try{await DB.doc(c+'/'+id).set(JSON.parse(js));prev.set(id,js)}catch(e){F(e)}}
  for(const id of [...prev.keys()])if(!cur.has(id)){try{await DB.doc(c+'/'+id).delete();prev.delete(id)}catch(e){F(e)}}}
 const t={...S.me};IMG.forEach(k=>delete t[k]);const js=JSON.stringify(t);
 if(SYNC.me!==js){try{await DB.doc('meta/me').set(t);SYNC.me=js}catch(e){F(e)}}
 for(const k of IMG){const v=S.me[k]||'';if((SYNC['img_'+k]||'')!==v){try{await DB.doc('meta/'+k).set({v});SYNC['img_'+k]=v}catch(e){F(e)}}}
 if(!bad)setSt('● Общая база: сохранено','#1a7f37')}
function applyCol(c,snap){
 const old=SYNC[c]||new Map(),loc=new Map(S[c].map(o=>[String(o.id),o])),out=[],nm=new Map();
 snap.docs.forEach(d=>{const id=d.id,js=JSON.stringify(d.data()),lo=loc.get(id);
  if(lo&&old.get(id)!==JSON.stringify(lo)){out.push(lo);nm.set(id,old.get(id))}
  else if(old.has(id)&&!lo){nm.set(id,old.get(id))}
  else{out.push(JSON.parse(js));nm.set(id,js)}});
 loc.forEach((lo,id)=>{if(!nm.has(id)&&!old.has(id))out.push(lo)});
 S[c]=out;SYNC[c]=nm}
const meDirty=()=>{const t={...S.me};IMG.forEach(k=>delete t[k]);return JSON.stringify(t)!==SYNC.me||IMG.some(k=>(S.me[k]||'')!==(SYNC['img_'+k]||''))};
function applyMeta(snap){const me={};let seeded=false;
 if(meDirty())return snap.docs.some(d=>d.id=='seeded');
 snap.docs.forEach(d=>{const x=d.data(),id=d.id;if(id=='seeded')seeded=true;else if(id=='me'){Object.assign(me,x);SYNC.me=JSON.stringify(x)}else if(IMG.includes(id)){me[id]=x.v||'';SYNC['img_'+id]=me[id]}});
 S.me=me;return seeded}
function softRender(){const a=document.activeElement,b=$('#body');if(a&&b.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){DIRTY=1;return}render()}
document.addEventListener('focusout',()=>{if(DIRTY){DIRTY=0;setTimeout(softRender,60)}});
function startLocal(){try{S=Object.assign(S,JSON.parse(localStorage.getItem('crm')||'{}'))}catch(e){}seedNom(false);seedMe();READY=true;setSt('○ Локальный режим: данные только в этом браузере','#b54708');render()}
async function boot(){
 $('#body').innerHTML='<p class="m">Загрузка общей базы…</p>';
 let db=null,u=null;try{db=await claude.use('db')}catch(e){}
 if(!db){startLocal();return}
 try{u=await claude.use('user')}catch(e){}
 try{RO=u?(await u.can('data.write'))===false:false}catch(e){}
 DB=db;
 try{const ls=JSON.parse(localStorage.getItem('crm')||'null');if(ls&&!RO&&!localStorage.getItem('crm_imported')&&COLS.some(c=>(ls[c]||[]).length))$('#imp').style.display=''}catch(e){}
 const first={},need=COLS.length+1;let n=0,seeded=false;
 const tmo=setTimeout(()=>{if(!READY)toast('База отвечает медленно: данные могут быть недоступны или устарели. Не перезагружайте страницу, подключение продолжается.')},10000);
 const upd=k=>{if(!first[k]){first[k]=1;n++}
  if(n>=need&&!READY){READY=true;clearTimeout(tmo);setSt(RO?'● Только просмотр':'● Общая база',RO?'#b54708':'#1a7f37');
   if(!seeded&&!RO){seedNom(true);seedMe();DB.doc('meta/seeded').set({at:Date.now()}).catch(fail)}}
  if(READY)softRender()};
 const err=e=>{toast('Нет доступа к общей базе: '+((e&&e.code)||'ошибка'));setSt('● Нет доступа','var(--r)')};
 COLS.forEach(c=>DB.collection(c).onSnapshot(s=>{applyCol(c,s);upd(c)},err));
 DB.collection('meta').onSnapshot(s=>{if(applyMeta(s))seeded=true;upd('meta')},err)}
function importLocal(){if(!DB||RO||!confirm('Загрузить данные, сохранённые в этом браузере, в общую базу? Делайте это один раз, чтобы не было дублей.'))return;
 let ls=null;try{ls=JSON.parse(localStorage.getItem('crm')||'null')}catch(e){}if(!ls)return;
 const map=new Map();COLS.forEach(c=>(ls[c]||[]).forEach(o=>map.set(String(o.id),uid())));
 const R=['id','clientId','carrierId','supplierId','vehicleId','driverId','pid','oid'];
 const fix=v=>{if(Array.isArray(v))return v.map(fix);if(v&&typeof v=='object'){const o={};for(const k in v){const x=v[k];o[k]=R.includes(k)&&map.has(String(x))?(typeof x=='number'?map.get(String(x)):String(map.get(String(x)))):fix(x)}return o}return v};
 const have=new Set(S.nom.map(x=>x.name));let n=0;
 COLS.forEach(c=>(ls[c]||[]).forEach(o=>{if(c=='nom'&&have.has(o.name))return;S[c].push(fix(o));n++}));

 const hide=()=>{l.style.display='none'};
 inp.addEventListener('focus',()=>{if(!free)inp.select();sh('')});

function nomWin(id,x,add){
 $('#m2').innerHTML=`<h3>Выбор товара из номенклатуры</h3>${add?`<div class="grid"><label>Наименование<input id="na"></label><label>Код (для накладной)<input id="nc2"></label><label>Плотность, кг/л<input id="nd" type="number" step="0.001" value="0.75"></label></div><div class="bar"><button class="p" onclick="nomAdd(${id},${x})">Добавить и выбрать</button><button onclick="nomWin(${id},${x})">Назад к списку</button></div>`:`<div class="bar"><input id="nq" placeholder="Поиск по названию или коду" value="${esc(NQ)}" oninput="NQ=this.value;nomList(${id},${x})"><button onclick="nomWin(${id},${x},1)">+ Новая позиция</button></div><div id="nl"></div>`}<div class="bar"><button onclick="closeW()">Отмена</button></div>`;
 $('#ov2').style.display='flex';if(add)$('#na').focus();else{nomList(id,x);$('#nq').focus()}}
function nomList(id,x){const q=NQ.trim().toLowerCase();$('#nl').innerHTML=S.nom.filter(n=>!q||(n.name+' '+(n.code||'')).toLowerCase().includes(q)).map(n=>`<div class="ni" onclick="nomPick(${id},${x},${n.id})">${esc(n.name)}<small>плотность ${n.d}${n.code?' · код '+esc(n.code):''}</small></div>`).join('')||'<p class="m">Ничего не найдено. Добавьте новую позицию.</p>'}
function nomPick(id,x,nid){const o=ord(id),n=S.nom.find(z=>z.id==nid);if(!n)return;o.items[x].n=n.name;if(n.d)o.items[x].d=n.d;save();closeW();openOrder(id)}
function nomAdd(id,x){const name=$('#na').value.trim();if(!name)return alert('Введите наименование');const n={id:uid(),name,code:$('#nc2').value.trim(),d:+$('#nd').value||0.75};S.nom.push(n);save();nomPick(id,x,n.id)}
function closeW(){$('#ov2').style.display='none'}
function tnDoc(id){const t=tr_(id);tg(t);
 const sp=S.suppliers.find(x=>x.id==t.supplierId)||{},cr=S.carriers.find(x=>x.id==t.carrierId)||{},v=S.vehicles.find(x=>x.id==t.vehicleId)||{},d=S.drivers.find(x=>x.id==t.driverId)||{},me=S.me,prod={},cons={},rows=[];
 t.secs.forEach((c,n)=>{const x=secItem(c);if(!x||!(+c.l>0))return;const k=x.i.n+'|'+x.i.d,q=S.nom.find(z=>z.name==x.i.n)||{},p=prod[k]||(prod[k]={n:x.i.n,code:q.code||'',d:+x.i.d,l:0}),cl=S.clients.find(z=>z.id==x.o.clientId)||{};p.l+=+c.l;cons[x.o.clientId]={cl,addr:x.o.addr};rows.push({n:n+1,cl,pn:x.i.n,l:+c.l,kg:c.l*x.i.d})});
 const PR=Object.values(prod),L=PR.reduce((s,p)=>s+p.l,0),KG=PR.reduce((s,p)=>s+p.l*p.d,0),o2=o=>`${esc(o.full||o.name||'—')}, ИНН ${esc(o.inn||'')}, ${esc(o.legal||'')}`;
 modal(`<div class="paper"><div style="text-align:right;font-size:11px">Приложение № 4 к Правилам перевозок грузов автомобильным транспортом</div><h3 style="text-align:center">ТРАНСПОРТНАЯ НАКЛАДНАЯ № ${t.no} от ${fd(t.date)}</h3>
 <table class="tn"><tr><th style="width:50%">1. Грузоотправитель</th><th>1а. Заказчик услуг, связанных с перевозкой груза</th></tr>
 <tr><td>${o2(sp)}<br>Р/с ${esc(sp.rs||'')} в ${esc(sp.bank||'')}, БИК ${esc(sp.bik||'')}, К/с ${esc(sp.ks||'')}</td><td>${o2(me)}</td></tr>
 <tr><th colspan=2>2. Грузополучатель</th></tr>
 ${Object.values(cons).map(({cl,addr})=>`<tr><td>${o2(cl)}</td><td>Адрес доставки: ${esc(addr||'—')}</td></tr>`).join('')||'<tr><td colspan=2>—</td></tr>'}</table>
 <table class="tn" style="margin-top:8px"><tr><th colspan=7>3. Груз</th></tr><tr><th>№</th><th>Товар</th><th>Код</th><th>Объём, л</th><th>Плотность, кг/л</th><th>Масса нетто, т</th><th>Ед. изм.</th></tr>
 ${PR.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.n)}</td><td>${esc(p.code)}</td><td>${p.l}</td><td>${p.d}</td><td>${(p.l*p.d/1000).toFixed(3)}</td><td>т</td></tr>`).join('')}
 <tr><td colspan=3><b>Итого</b></td><td><b>${L}</b></td><td></td><td><b>${(KG/1000).toFixed(3)}</b></td><td></td></tr></table>
 <p style="font-size:12px">Всего наименований: ${PR.length}. Масса нетто: ${KG.toFixed(0)} кг. Объём: ${L} л.</p>
 <table class="tn"><tr><th colspan=5>Распределение по секциям и получателям</th></tr><tr><th>Секция</th><th>Грузополучатель</th><th>Товар</th><th>Литры</th><th>кг</th></tr>${rows.map(r=>`<tr><td>${r.n}</td><td>${esc(r.cl.short||r.cl.name||'—')}</td><td>${esc(r.pn)}</td><td>${r.l}</td><td>${r.kg.toFixed(0)}</td></tr>`).join('')}</table>
 <table class="tn" style="margin-top:8px"><tr><th style="width:50%">6. Перевозчик</th><th>7. Транспортное средство</th></tr><tr><td>${o2(cr)}<br>Водитель: ${esc(d.fio||'—')}, ВУ ${esc(d.license||'')}</td><td>Тягач: ${esc(v.tractor||'')} ${esc(v.tractorNo||'')}<br>Прицеп: ${esc(v.trailer||'')} ${esc(v.trailerNo||'')}${v.total?'<br>Вместимость '+esc(v.total)+' л':''}</td></tr></table>
 <div class="sign"><div>Грузоотправитель _____________</div><div>Водитель _____________</div><div>Грузополучатель _____________</div></div></div>
 <div class="bar"><button class="p" onclick="window.print()">Печать</button><button onclick="openTrip(${id})">Назад</button></div>`)}
/* ===== Окно напоминаний (правый нижний угол) ===== */
let RWMIN=false;try{RWMIN=localStorage.getItem('crm_rw_min')=='1'}catch(e){}
let RWSH=false;try{RWSH=localStorage.getItem('crm_rw_done')=='1'}catch(e){}
function rwInit(){const w=$('#rw');w.className=RWMIN?'min':'';
 w.innerHTML=`<div class="h" onclick="rwToggle()"><span>🔔 Напоминания</span><span class="n" id="rwn" style="display:none"></span><span style="flex:1"></span><span id="rwa">${RWMIN?'▲':'▼'}</span></div><div class="bd"><div id="rwl"></div><label style="flex-direction:row;align-items:center;gap:6px;margin:0 0 8px;cursor:pointer;font-size:12px"><input type="checkbox" id="rwsh" style="width:auto" ${RWSH?'checked':''} onchange="rwShow(this.checked)">Показать выполненные</label><div class="f"><input type="text" id="rwt" placeholder="Кому позвонить / что сделать" onkeydown="if(event.key=='Enter')rwAdd()"><input type="date" id="rwd" value="${today()}"><button class="p" onclick="rwAdd()">+ Добавить</button></div></div>`}
function rwToggle(){RWMIN=!RWMIN;$('#rw').classList.toggle('min',RWMIN);$('#rwa').textContent=RWMIN?'▲':'▼';try{localStorage.setItem('crm_rw_min',RWMIN?'1':'0')}catch(e){}}
function rwRender(){const l=$('#rwl');if(!l)return;const op=S.reminders.filter(r=>!r.done).sort((a,b)=>String(a.date).localeCompare(String(b.date))),dn=RWSH?S.reminders.filter(r=>r.done).sort((a,b)=>String(b.date).localeCompare(String(a.date))):[],od=op.filter(r=>!r.date||r.date<=today()).length,n=$('#rwn');
 n.textContent=od;n.style.display=od?'':'none';
 const it=r=>`<div class="it"><input type="checkbox" ${r.done?'checked':''} title="${r.done?'Вернуть в активные':'Выполнено'}" onchange="${r.done?'rwUndo':'rwDone'}(${r.id})"><span class="d ${r.done||(r.date&&r.date>today())?'m':'od'}">${fd(r.date)}</span><span style="flex:1;${r.done?'text-decoration:line-through;color:var(--m)':''}">${esc(r.text)}</span><button title="Удалить" onclick="rwDel(${r.id})">×</button></div>`;
 l.innerHTML=op.map(it).join('')+dn.map(it).join('')||'<div class="m">Нет напоминаний</div>'}
function rwAdd(){const t=$('#rwt').value.trim();if(!t){$('#rwt').focus();return}S.reminders.push({id:uid(),text:t,date:$('#rwd').value||today()});$('#rwt').value='';save();render()}
function rwDone(id){const r=S.reminders.find(x=>x.id==id);if(r)r.done=true;save();render()}
function rwDel(id){S.reminders=S.reminders.filter(x=>x.id!=id);save();render()}
function rwShow(v){RWSH=!!v;try{localStorage.setItem('crm_rw_done',RWSH?'1':'0')}catch(e){}rwRender()}
function rwUndo(id){const r=S.reminders.find(x=>x.id==id);if(r)r.done=false;save();render()}
rwInit();
boot();
</script></body></html>
